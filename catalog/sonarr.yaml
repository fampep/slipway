id: sonarr
name: Sonarr
description: Smart PVR for usenet and torrents — automate TV downloads.
category: automation
image: lscr.io/linuxserver/sonarr:latest
icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/sonarr.svg
ports:
  - host: "8989"
    container: "8989"
volumes:
  - host: "./config"
    container: "/config"
  - host: "../../downloads"
    container: "/downloads"
  - host: "../../media"
    container: "/tv"
env:
  PUID: "1000"
  PGID: "1000"
  TZ: UTC
webui_port: "8989"
restart: unless-stopped
