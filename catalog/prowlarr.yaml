id: prowlarr
name: Prowlarr
description: Indexer manager and proxy for Sonarr, Radarr, and friends.
category: automation
image: lscr.io/linuxserver/prowlarr:latest
icon: prowlarr
ports:
  - host: "9696"
    container: "9696"
volumes:
  - host: "./config"
    container: "/config"
env:
  PUID: "1000"
  PGID: "1000"
  TZ: UTC
webui_port: "9696"
restart: unless-stopped
