id: qbittorrent
name: qBittorrent
description: Lightweight torrent client with a full-featured web UI.
category: download
image: lscr.io/linuxserver/qbittorrent:latest
icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/qbittorrent.svg
ports:
  - host: "8081"
    container: "8080"
  - host: "6881"
    container: "6881"
  - host: "6881"
    container: "6881"
    protocol: udp
volumes:
  - host: "./config"
    container: "/config"
  - host: "../../downloads"
    container: "/downloads"
env:
  PUID: "1000"
  PGID: "1000"
  TZ: UTC
  WEBUI_PORT: "8080"
webui_port: "8081"
restart: unless-stopped
