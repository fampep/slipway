id: vaultwarden
name: Vaultwarden
description: Lightweight Bitwarden-compatible password manager server.
category: tools
image: vaultwarden/server:latest
icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/svg/vaultwarden.svg
tags: [tools, storage]
ports:
  - host: "8088"
    container: "80"
volumes:
  - host: "./data"
    container: "/data"
webui_port: "8088"
restart: unless-stopped
