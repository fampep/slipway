services:
  slipway:
    image: ${SLIPWAY_IMAGE:-ghcr.io/fampep/slipway:latest}
    build: .
    container_name: slipway
    restart: unless-stopped
    ports:
      - "${SLIPWAY_PORT:-8080}:8080"
    volumes:
      - slipway-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Host filesystem for multi-drive metrics (read-only)
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      SLIPWAY_ADDR: ":8080"
      SLIPWAY_DATA: /data
      SLIPWAY_CATALOG: /app/catalog
      SLIPWAY_WEB: /app/web/dist
      SLIPWAY_HOST_ROOT: /host
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ETC: /host/etc
    group_add:
      - "${DOCKER_GID:-991}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  slipway-data:
